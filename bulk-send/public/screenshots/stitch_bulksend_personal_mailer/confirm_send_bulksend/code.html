</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-background">Send Campaign?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Confirm final details before dispatch.</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-on-background transition-colors focus:outline-none">

</button>
</div>

<div class="bg-surface-container-low rounded-lg p-4 border border-outline-variant/30 flex flex-col gap-4">

</div>

</div>
</div>
