<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BulkSend Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f7f9fb] text-[#191c1e] min-h-screen flex items-center justify-center p-4">
<div class="bg-white border border-[#bcc9c6] rounded-xl p-8 shadow-sm w-full max-w-md flex flex-col items-center">
<div class="flex flex-col items-center mb-10">
<img alt="BulkSend Logo" class="w-16 h-16 object-contain mb-4 rounded-md" src="../../assets/bulksend_logo/screen.png"/>
<h1 class="text-2xl font-semibold text-[#00685f]">BulkSend</h1>
<p class="text-sm text-[#3d4947] mt-2 text-center">Welcome back. Please sign in to continue.</p>
</div>
<div class="w-full flex flex-col gap-4">
<button class="w-full flex items-center justify-center gap-3 bg-white border border-[#bcc9c6] hover:bg-[#f2f4f6] transition-colors rounded-md py-3 px-4 font-semibold text-[#191c1e]">Continue with Google</button>
<button class="w-full flex items-center justify-center gap-3 bg-white border border-[#bcc9c6] hover:bg-[#f2f4f6] transition-colors rounded-md py-3 px-4 font-semibold text-[#191c1e]">Continue with Outlook</button>
</div>
<div class="mt-8 text-center"><p class="text-xs text-[#3d4947]">By continuing, you agree to our <a class="text-[#00685f] hover:underline" href="#">Terms of Service</a>.</p></div>
</div>
</body></html>
